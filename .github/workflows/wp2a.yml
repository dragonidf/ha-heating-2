name: WP2A offline integration and ledger
on:
  push:
    branches: [feature/wp2a-offline-integration-ledger]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    name: Python ${{ matrix.python }} WP2A full checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Observe linked SQLite without claiming target qualification
        run: python -c 'from packages.control_store.qualification import inspect_sqlite; print(inspect_sqlite())'
      - name: Build pinned qualified SQLite only in disposable test environment
        run: |
          python -m tests.fixtures.build_sqlite
          echo "LD_LIBRARY_PATH=/tmp/heating-wp1b-sqlite-3510300" >> "$GITHUB_ENV"
      - name: Require actual linked test runtime qualification
        run: |
          python -c 'from packages.control_store.qualification import inspect_sqlite; from tests.fixtures.build_sqlite import SOURCE_ID; info=inspect_sqlite(); print(info); assert info.qualified and info.version == "3.51.3" and info.source_id == SOURCE_ID'
      - name: Use a disposable runner filesystem for SQLite fault tests
        run: |
          mkdir -p "$RUNNER_TEMP/heating-wp1b-db-tmp"
          echo "TMPDIR=$RUNNER_TEMP/heating-wp1b-db-tmp" >> "$GITHUB_ENV"
      - name: Observe actual test process and filesystem
        run: |
          python -c 'import platform; print(platform.python_version(), platform.system(), platform.release(), platform.machine())'
          findmnt -T "$TMPDIR" -n -o FSTYPE
      - run: make check
      - name: Verify reviewed source and evidence integrity
        run: |
          sha256sum --check docs/wp1a/SHA256SUMS
          sha256sum --check docs/wp1b/SHA256SUMS
          sha256sum --check docs/wp1c/REGRESSION-BASELINE.sha256
          sha256sum --check docs/wp1c/SHA256SUMS
          sha256sum --check docs/wp2a/REGRESSION-BASELINE.sha256
          sha256sum --check docs/wp2a/SHA256SUMS
      - name: Disposable evidence/integration host benchmark
        run: python -m tests.wp2a.benchmark
      - name: Record exact tested SHA and full-suite inventory
        run: |
          python -c 'import json,os,platform,subprocess,unittest; from packages.control_store.qualification import inspect_sqlite; print(json.dumps(dict(sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),python=platform.python_version(),tests=unittest.defaultTestLoader.discover(".").countTestCases(),sqlite=repr(inspect_sqlite()),run=os.environ["GITHUB_RUN_ID"],scope="synthetic offline; G1 BLOCKED"),sort_keys=True))'
