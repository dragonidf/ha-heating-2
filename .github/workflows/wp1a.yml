name: WP1A pure library
on:
  push:
    branches: [main, feature/wp1a-pure-kernel]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    name: Python ${{ matrix.python }} synthetic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build pinned SQLite for the combined offline regression suite
        run: |
          python -m tests.fixtures.build_sqlite
          echo "LD_LIBRARY_PATH=/tmp/heating-wp1b-sqlite-3510300" >> "$GITHUB_ENV"
      - name: Use disposable runner filesystem for combined offline tests
        run: |
          mkdir -p "$RUNNER_TEMP/heating-wp1b-db-tmp"
          echo "TMPDIR=$RUNNER_TEMP/heating-wp1b-db-tmp" >> "$GITHUB_ENV"
      - name: Type, negative, contract, property, mutation and purity checks
        run: make check
      - name: Verify reviewed source and evidence checksums
        run: sha256sum --check docs/wp1a/SHA256SUMS
