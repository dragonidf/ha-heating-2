name: Heating v2 focused stability candidate (no release)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'dragonidf/ha-heating-2' && github.event.issue.number == 40 && github.event.comment.user.login == 'dragonidf' && github.event.comment.body == '/verify-heating-v2-stability' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REVIEW_SHA: f84cdf3bcc943edd6ecc513e6f3c53625184bfc4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REVIEW_SHA }}
          persist-credentials: false
      - name: Refuse superseded head / changed physical gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          gh api "repos/$GH_REPO/pulls/43" --jq .head.sha | grep -Fx "$REVIEW_SHA"
          grep -F 'physical_commands_enabled=False' releases/ha_v2/custom_components/heating_ai_v2/native_runtime.py
          test -f releases/ha_v2/custom_components/heating_ai_v2/source_monitor.py
          test -f releases/ha_v2/custom_components/heating_ai_v2/sensor.py
          test -f frontend/src/LiveClimateTimeline.tsx
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Existing focused source and zero-actuation guards
        run: python -m unittest tests.wp2c_revision.test_live_shadow_v2 tests.wp2c_revision.test_forecast_sources_v2 -q
      - name: Exact HA 2026.11 import and source-stability lifecycle (one pass)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
          mkdir -p releases/ha_v2/custom_components/heating_ai_v2/assets
          printf '/* CI-only frontend placeholder */' > releases/ha_v2/custom_components/heating_ai_v2/assets/livePanel.js
          python tools/release/build_v2_engine.py --output releases/ha_v2/custom_components/heating_ai_v2/engine
          PYTHONPATH=releases/ha_v2 python tools/release/test_ha2026_v2_lifecycle.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: One frontend panel test and strict TypeScript, no browser matrix
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run tests/live-panel.test.tsx
      - name: Confirm native UI bundle can be built
        working-directory: frontend
        run: |
          npx vite build --config vite.live.config.ts
          test -s dist-live/assets/livePanel.js
