name: Heating AI 2.0 v0.2.1 UI Marketplace patch
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.repository == 'dragonidf/ha-heating-2' && github.event.issue.number == 40 && github.event.comment.user.login == 'dragonidf' && github.event.comment.body == '/publish-heating-v2-0.2.1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: 38bdfc3b02b3ca439041e9b722e7286fd810a564
      BASE_TAG: v0.2.0
      RELEASE_TAG: v0.2.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Gate exact PR and UI-only diff against prior tested release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GH_REPO']; head=os.environ['RELEASE_SHA']; tag=os.environ['BASE_TAG']
          def gh(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          pr=gh('pulls/43')
          assert pr['head']['sha']==head and pr['head']['ref']=='release/p0-native-live-ui-pipeline-20261111'
          assert pr['head']['repo']['full_name']==repo and pr['draft'] and not pr['merged']
          root=json.load(open('manifest.json'))
          installed=json.load(open('releases/ha_v2/custom_components/heating_ai_v2/manifest.json'))
          hacs=json.load(open('hacs.json'))
          assert root==installed and root['version']=='0.2.1' and root['domain']=='heating_ai_v2'
          assert hacs['zip_release'] is True and hacs['content_in_root'] is True
          assert hacs['filename']=='heating_ai_v2.zip'
          prior=gh('git/ref/tags/'+tag)['object']['sha']
          diff=gh('compare/'+prior+'...'+head)
          changed={f['filename'] for f in diff['files']}
          allowed={
              'frontend/src/LiveClimateTimeline.tsx',
              'frontend/src/liveHA.ts',
              'frontend/src/livePages.tsx',
              'frontend/src/styles.css',
              'frontend/tests/live-panel.test.tsx',
              'manifest.json',
              'releases/ha_v2/custom_components/heating_ai_v2/manifest.json',
          }
          assert diff['status']=='ahead' and changed <= allowed,changed
          assert 'frontend/src/LiveClimateTimeline.tsx' in changed and 'frontend/tests/live-panel.test.tsx' in changed
          print('UI-only patch diff verified; physical backend and critical ledger untouched:', sorted(changed))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Focused TypeScript and one panel test (no broad QA)
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run tests/live-panel.test.tsx
      - name: Rebuild ONLY the changed native UI bundle
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx vite build --config vite.live.config.ts
          test -s dist-live/assets/livePanel.js
      - name: Reuse tested v0.2.0 native engine and package; replace UI and version only
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$BASE_TAG" --repo "$GH_REPO" --pattern heating_ai_v2.zip --dir old-release
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          base=pathlib.Path('old-release/heating_ai_v2.zip')
          frontend=pathlib.Path('frontend/dist-live/assets/livePanel.js')
          manifest=pathlib.Path('manifest.json').read_bytes()
          target=pathlib.Path('heating_ai_v2.zip')
          assert base.is_file() and frontend.stat().st_size>10000
          with zipfile.ZipFile(base) as old,zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as out:
              names=old.namelist()
              assert len(names)>25
              assert json.loads(old.read('manifest.json'))['version']=='0.2.0'
              assert all(not x.startswith('/') and '..' not in pathlib.PurePosixPath(x).parts for x in names)
              for name in sorted(names):
                  content=(manifest if name=='manifest.json' else
                           frontend.read_bytes() if name=='assets/livePanel.js' else old.read(name))
                  out.writestr(name, content)
          with zipfile.ZipFile(target) as new,zipfile.ZipFile(base) as old:
              needed={'manifest.json','__init__.py','config_flow.py','native_runtime.py','native_api.py',
                      'critical_ledger.py','assets/livePanel.js','engine/SOURCE-SHA256.json'}
              assert needed<=set(new.namelist())
              assert new.read('manifest.json')==manifest and new.read('assets/livePanel.js')==frontend.read_bytes()
              assert new.testzip() is None
              assert all(old.read(n)==new.read(n) for n in old.namelist()
                         if n not in ('manifest.json','assets/livePanel.js')), 'Unexpected native backend mutation'
          print('Focused UI update ZIP ready',target.stat().st_size,hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - name: Publish new immutable v0.2.1 Marketplace version
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite Marketplace version'
            exit 0
          fi
          gh release create "$RELEASE_TAG" heating_ai_v2.zip --repo "$GH_REPO" --target "$RELEASE_SHA" \
            --title 'Heating AI 2.0 v0.2.1 — графік температури і плану' \
            --notes 'New first-screen timeline: last 6h actual HA Recorder, up to 24h conditional native thermal trajectory, user room-target steps, possible heat windows and readout. Technical diagnostics folded. No fake forecast or changes to native backend, old thermostat writer, fan controls or physical safety gate; physical commands remain OFF.'
