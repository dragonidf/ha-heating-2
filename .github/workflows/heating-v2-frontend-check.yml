name: Heating v2 focused frontend check
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  frontend:
    if: ${{ github.repository == 'dragonidf/ha-heating-2' && github.event.issue.number == 40 && github.event.comment.user.login == 'dragonidf' && github.event.comment.body == '/verify-heating-v2-frontend' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/p0-native-live-ui-pipeline-20261111
          persist-credentials: false
      - name: Confirm exact current PR head before test
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GH_REPO/pulls/43" --jq .head.sha)"
          test "$(git rev-parse HEAD)" = "$head_sha"
          echo "Focused UI checks for $head_sha (no HA installation or release)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: TypeScript and one panel test
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run tests/live-panel.test.tsx
          npx vite build --config vite.live.config.ts
          test -s dist-live/assets/livePanel.js
