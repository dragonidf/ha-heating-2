name: P0 v2 live HA installable package
on:
  pull_request:
    paths:
      - 'frontend/src/liveHA.ts'
      - 'frontend/src/livePages.tsx'
      - 'frontend/src/live-panel.tsx'
      - 'frontend/src/App.tsx'
      - 'frontend/vite.live.config.ts'
      - 'frontend/tests/live-ha.test.ts'
      - 'releases/ha_v2/**'
      - '.github/workflows/p0-live-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Accepted frontend tests and strict typecheck
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run test
      - name: Build reviewed real HA panel with no CDN
        working-directory: frontend
        run: |
          npx vite build --config vite.live.config.ts
          test -s dist-live/assets/livePanel.js
      - name: Read-only safety tests
        run: |
          python -m unittest tests.wp2c_revision.test_live_shadow_v2 -v
          python -m compileall -q releases/ha_v2/custom_components/heating_ai_v2
      - name: Compose one self-contained HA folder and ZIP
        run: |
          python - <<'PY'
          import pathlib, shutil, zipfile, hashlib, json
          root=pathlib.Path('p0-release')
          dest=root/'custom_components'/'heating_ai_v2'
          shutil.copytree('releases/ha_v2/custom_components/heating_ai_v2',dest,
                          ignore=shutil.ignore_patterns('__pycache__','*.pyc'))
          shutil.copytree('frontend/dist-live/assets', dest/'assets')
          assert (dest/'assets'/'livePanel.js').is_file()
          assert (dest/'manifest.json').is_file()
          manifest=json.loads((dest/'manifest.json').read_text())
          assert manifest['domain']=='heating_ai_v2'
          assert manifest['requirements']==[]
          zip_path=pathlib.Path('heating-ai-v2-live-shadow.zip')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p,p.relative_to(root))
          with zipfile.ZipFile(zip_path) as z:
              assert 'custom_components/heating_ai_v2/assets/livePanel.js' in z.namelist()
              assert 'custom_components/heating_ai_v2/manifest.json' in z.namelist()
          print(json.dumps({'file':str(zip_path),'sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),
                            'bytes':zip_path.stat().st_size},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heating-ai-v2-live-shadow
          path: heating-ai-v2-live-shadow.zip
          retention-days: 14
          if-no-files-found: error
