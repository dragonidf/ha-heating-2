name: WP1B offline store and simulator
on:
  push:
    branches: [feature/wp1b-offline-store-simulator]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    name: Python ${{ matrix.python }} offline faults
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Observe linked SQLite without claiming target qualification
        run: python -c 'from packages.control_store.qualification import inspect_sqlite; print(inspect_sqlite())'
      - run: make check
