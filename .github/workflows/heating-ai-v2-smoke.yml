name: Heating AI 2.0 read-only HA 2026.11 import smoke
on:
  pull_request:
    paths:
      - 'custom_components/heating_ai_v2/**'
      - 'tests/wp2c_revision/test_live_shadow_v2.py'
      - '.github/workflows/heating-ai-v2-smoke.yml'
permissions:
  contents: read
jobs:
  shadow-import:
    name: HA 2026.11 shadow import and safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Run read-only source and zero-value regressions
        run: python -m unittest tests.wp2c_revision.test_live_shadow_v2 -v
      - name: Install exact HA release in disposable CI environment only
        run: python -m pip install --disable-pip-version-check 'homeassistant==2026.11.0'
      - name: Verify supported HA imports and config form
        run: |
          python - <<'PY'
          import custom_components.heating_ai_v2 as integration
          from custom_components.heating_ai_v2 import config_flow, sensor, telemetry
          from homeassistant.config_entries import ConfigFlowResult
          from homeassistant.components.sensor import SensorEntity
          form = config_flow.mapping_schema()
          assert len(form.schema) == len(telemetry.ROLES) == 10
          assert issubclass(sensor.ShadowSensor, SensorEntity)
          assert hasattr(integration, 'async_setup_entry')
          assert hasattr(integration, 'async_unload_entry')
          assert telemetry.snapshot({})['commands_enabled'] is False
          print('HA2026.11 imports/schema OK; profile has no writer')
          PY
