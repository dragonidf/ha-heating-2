name: One-time release branch Prettier normalization
on:
  push:
    branches:
      - release/p0-native-live-ui-pipeline-20261111
    paths:
      - '.github/workflows/p0-one-time-format.yml'
permissions:
  contents: write
jobs:
  format-controlled-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'dragonidf/ha-heating-2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/p0-native-live-ui-pipeline-20261111
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Format ONLY five new live files with pinned Prettier
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            src/liveHA.ts src/liveApp.tsx src/livePages.tsx src/live-panel.tsx \
            tests/live-ha.test.ts
      - name: Commit formatter-only diff to the dedicated branch
        run: |
          git diff --check
          git add -- frontend/src/liveHA.ts frontend/src/liveApp.tsx \
            frontend/src/livePages.tsx frontend/src/live-panel.tsx frontend/tests/live-ha.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(release): normalize live-only TypeScript with pinned Prettier"
            git push origin HEAD:release/p0-native-live-ui-pipeline-20261111
          fi
