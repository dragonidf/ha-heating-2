name: One-time v2 fireplace UI formatting
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/src/liveHA.ts'
      - 'frontend/src/live-panel.tsx'
      - 'frontend/src/livePages.tsx'
      - 'frontend/tests/live-ha.test.ts'
      - '.github/workflows/p0-one-time-format.yml'
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'dragonidf/ha-heating-2' && github.event.pull_request.number == 43 && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/p0-native-live-ui-pipeline-20261111
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Use pinned frontend formatter for four live-only files
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx prettier --write src/liveHA.ts src/live-panel.tsx src/livePages.tsx tests/live-ha.test.ts
      - name: Commit only formatted live files
        run: |
          git diff --check
          git add -- frontend/src/liveHA.ts frontend/src/live-panel.tsx frontend/src/livePages.tsx frontend/tests/live-ha.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(v2): format optional fireplace and circulation UI using pinned Prettier"
            git push origin HEAD:release/p0-native-live-ui-pipeline-20261111
          fi
